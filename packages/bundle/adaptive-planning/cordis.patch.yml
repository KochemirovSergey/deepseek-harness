# Opt-in adaptive-planning capability layer. Storage-backed calibration activates
# when the host composition provides ctx.storageDomain; core planning and tools
# do not depend on storage. No row automatically reorders or applies Git work.
- insert:
    - id: planning
      name: '@deepseek-ai/dsh-planning'

    - id: planning-calibration
      name: '@deepseek-ai/dsh-planning-calibration'

    - id: planning-observer
      name: '@deepseek-ai/dsh-planning-observer'

    - id: planning-review
      name: '@deepseek-ai/dsh-planning-review'

    - id: tool-planning
      name: '@deepseek-ai/dsh-tool-planning'
